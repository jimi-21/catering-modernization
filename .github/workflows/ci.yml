name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: file:./dev.db
  AUTH_SECRET: ci-only-secret-with-at-least-32-characters
  ADMIN_EMAIL: admin@hengshan.demo
  ADMIN_PASSWORD: Demo!2026
  NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run db:setup
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run migrate:legacy -- --dry-run
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: test-results
          retention-days: 7

  cross-browser:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run db:setup
      - run: npm run build
      - run: npx playwright install --with-deps webkit
      - run: PLAYWRIGHT_BROWSER=firefox npm run test:e2e
      - run: PLAYWRIGHT_BROWSER=webkit npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: cross-browser-report
          path: test-results
          retention-days: 7
